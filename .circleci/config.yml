version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:24.21
        environment:
          TERM: xterm
          TZ: "America/New_York"

commands:
  install:
    description: Check out the repo and install dependencies from the lockfile
    steps:
      - checkout
      - restore_cache:
          keys:
            - v3-yarn-{{ checksum "yarn.lock" }}
      - run: yarn install --immutable
      - save_cache:
          key: v3-yarn-{{ checksum "yarn.lock" }}
          paths:
            - ~/.yarn/berry/cache

jobs:
  lint:
    executor: node
    steps:
      - install
      - run:
          name: Run Linter
          command: yarn lint
      - run:
          name: Check Formatting
          command: yarn format:check
          # Report formatting even when lint fails, so one CI run shows both.
          when: always

  typecheck:
    executor: node
    steps:
      - install
      - run:
          name: Type Check
          command: yarn typecheck

  unit_test:
    executor: node
    steps:
      - install
      - run:
          name: Unit Test (React 19)
          command: yarn test:coverage --runInBand
      - run:
          name: Unit Test (React 18)
          command: yarn test:react18 --runInBand
          # Report the React 18 run even when the React 19 run fails.
          when: always

  build:
    executor: node
    steps:
      - install
      - run:
          name: Build
          command: yarn build

workflows:
  ci:
    jobs:
      - lint:
          name: Lint
      - typecheck:
          name: Typecheck
      - unit_test:
          name: Unit Tests
          requires:
            - Lint
            - Typecheck
      - build:
          name: Build
          requires:
            - Lint
            - Typecheck
